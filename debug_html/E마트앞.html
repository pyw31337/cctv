<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Pretendard", system-ui, -apple-system, "Noto Sans KR",
          sans-serif;
        background: #ffffff;
        color: #253776;
      }
      .error-page {
        position: relative;
        width: 100%;
        height: 100vh;
        background: url("/error/img-error-bg.png") no-repeat center center / cover;
      }
      .logo {
        width: 235px;
        height: 36px;
        object-fit: contain;
      }
      .error-box {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 543px;
        max-width: 100%;
        text-align: center;
      }
      .img-error {
        width: 100%;
        max-width: 543px;
        margin: 60px 0 50px;
        object-fit: contain;
      }
      .texts {
        text-align: center;
        color: #253776;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 20px;
      }
      .title {
        font-size: 36px;
        font-weight: 700;
        line-height: 1.5;
      }
      .desc {
        font-size: 18px;
        font-weight: 400;
        line-height: 1.5;
        color: #585858;
      }
      .copyright {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        font-weight: 400;
        color: #919191;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-box">
        <img class="logo" src="/error/img-logo.svg" alt="한국도로교통공단 로고" />
        <img class="img-error" src="/error/img-error.png" alt="에러 안내 이미지" />

        <div class="texts">
          <div class="title">고객님께 불편을 드려서 죄송합니다.</div>
          <div class="desc">
            현재 홈페이지 접속량이 많아 접속이 원활하지 않습니다. <br />잠시 후
            다시 이용해 주시기 바랍니다.
          </div>
        </div>
      </div>

      <div class="copyright">
        Copyright(c) 2025 NPA KoROAD. All Rights reserved
      </div>
    </div>
  </body>
</html>
