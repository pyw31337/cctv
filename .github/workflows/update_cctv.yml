name: Update CCTV Data

on:
  schedule:
    # Twelve-hour wake-up; adaptive_collection decides whether full refresh is due.
    - cron: '20 */12 * * *'
  workflow_dispatch:

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

permissions:
  contents: write

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Allow up to 4 hours for stealth sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Plan adaptive collection
        id: plan
        run: python scripts/adaptive_collection.py plan --github-output

      - name: Run optimized sync
        if: steps.plan.outputs.due_full_refresh == 'true'
        id: full_refresh
        continue-on-error: true
        env:
          # Missing secrets resolve to empty strings: ITS then falls back to the
          # public demo key and UTIC reuses existing records. Both cases are
          # recorded as key_problem events in data/workflow_status.json.
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          UTIC_API_KEY: ${{ secrets.UTIC_API_KEY }}
        run: python collect_cctv_data.py --force --duration 3.0

      - name: Validate CCTV data
        id: validate
        if: steps.plan.outputs.due_full_refresh == 'true' && steps.full_refresh.outcome == 'success'
        run: |
          echo "Running validation..."
          python validate_cctv_data.py
          echo "validation_passed=true" >> "$GITHUB_OUTPUT"

      - name: Guard data preservation
        id: preservation
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          set +e
          python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses --max-drop-ratio 0.05
          guard_status=$?
          set -e

          if [[ $guard_status -ne 0 ]]; then
            cp /tmp/cctv_data.before.json cctv_data.json
            echo "preservation_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unsafe dataset refresh was rolled back; the current production catalog was preserved."
          else
            echo "preservation_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate persisted data hygiene
        if: steps.validate.outputs.validation_passed == 'true' && steps.preservation.outputs.preservation_passed == 'true'
        run: python scripts/validate_static_data.py cctv_data.json

      - name: Record adaptive collection result
        if: always() && steps.plan.outputs.due_full_refresh == 'true'
        run: |
          if [[ "${{ steps.full_refresh.outcome }}" == "success" && "${{ steps.validate.outputs.validation_passed }}" == "true" && "${{ steps.preservation.outputs.preservation_passed }}" == "true" ]]; then
            python scripts/adaptive_collection.py record --task full_refresh --result success
          else
            python scripts/adaptive_collection.py record --task full_refresh --result failure
            python scripts/write_workflow_status.py --workflow "Update CCTV Data" --job full-refresh --status warning --impact possible \
              --message "full refresh outcome=${{ steps.full_refresh.outcome }} validation=${{ steps.validate.outputs.validation_passed || 'skipped' }} preservation=${{ steps.preservation.outputs.preservation_passed || 'skipped' }}; existing cctv_data.json preserved"
          fi

      - name: Check for changes
        id: check_changes
        if: steps.validate.outputs.validation_passed == 'true' && steps.preservation.outputs.preservation_passed == 'true'
        run: |
          if [[ -n "$(git status -s cctv_data.json data/collection_schedule.json data/workflow_status.json)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          if git diff --quiet -- cctv_data.json data/collection_schedule.json data/workflow_status.json; then
            echo "No full refresh or scheduler changes"
          else
            scripts/commit_and_push_changes.sh "Auto-update: adaptive CCTV data (Validated) [skip ci]" cctv_data.json data/collection_schedule.json data/workflow_status.json
          fi

      # When the refresh was rejected, still publish the status events (key
      # problems, failed refresh) so the failure is visible on quality.html.
      # The rejected cctv_data.json is restored first and never committed.
      - name: Publish workflow status after rejected refresh
        if: always() && steps.plan.outputs.due_full_refresh == 'true' && steps.check_changes.outputs.changes_detected != 'true'
        run: |
          git checkout -- cctv_data.json 2>/dev/null || true
          if git diff --quiet -- data/workflow_status.json; then
            echo "No workflow status changes"
          else
            scripts/commit_and_push_changes.sh "chore: record CCTV refresh status [skip ci]" data/workflow_status.json
          fi
