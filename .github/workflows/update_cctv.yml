name: Update CCTV Data

on:
  schedule:
    # Weekly full data refresh: Sunday 09:20 KST (= 00:20 UTC), away from daily data jobs.
    - cron: '20 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Allow up to 4 hours for stealth sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run optimized sync
        run: python collect_cctv_data.py --force --duration 3.0

      - name: Validate CCTV data
        id: validate
        run: |
          echo "Running validation..."
          python validate_cctv_data.py
          echo "validation_passed=true" >> "$GITHUB_OUTPUT"

      - name: Guard data preservation
        id: preservation
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          set +e
          python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses --max-drop-ratio 0.05
          guard_status=$?
          set -e

          if [[ $guard_status -ne 0 ]]; then
            cp /tmp/cctv_data.before.json cctv_data.json
            echo "preservation_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unsafe dataset refresh was rolled back; the current production catalog was preserved."
          else
            echo "preservation_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: check_changes
        if: steps.validate.outputs.validation_passed == 'true' && steps.preservation.outputs.preservation_passed == 'true'
        run: |
          if [[ -n "$(git status -s cctv_data.json)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          scripts/commit_and_push_changes.sh "Auto-update: CCTV data (Validated) [skip ci]" cctv_data.json
