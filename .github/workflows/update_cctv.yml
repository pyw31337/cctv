name: Update CCTV Data

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Allow up to 4 hours for stealth sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run optimized sync
        run: python collect_cctv_data.py --force --duration 3.0

      - name: Validate CCTV data
        id: validate
        run: |
          echo "Running validation..."
          python validate_cctv_data.py
          echo "validation_passed=true" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check_changes
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          if [[ -n $(git status -s cctv_data.json) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cctv_data.json
          git commit -m "Auto-update: CCTV data (Validated)"
          git push
