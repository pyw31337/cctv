name: Update CCTV Data

on:
  schedule:
    # Weekly full data refresh to stay within the free Actions quota.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cctv-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Allow up to 4 hours for stealth sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run optimized sync
        run: python collect_cctv_data.py --force --duration 3.0

      - name: Validate CCTV data
        id: validate
        run: |
          echo "Running validation..."
          python validate_cctv_data.py
          echo "validation_passed=true" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check_changes
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          if [[ -n $(git status -s cctv_data.json) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cctv_data.json
          git commit -m "Auto-update: CCTV data (Validated)"
          
          # Retry loop for push to handle concurrent updates from other workflows (e.g. Sentinel)
          for i in {1..5}; do
            echo "Push attempt $i..."
            if git pull --rebase origin main; then
              if git push; then
                echo "Successfully pushed changes."
                exit 0
              fi
            else
              echo "Rebase conflict! Using our generated cctv_data.json"
              git checkout --theirs cctv_data.json
              git add cctv_data.json
              GIT_EDITOR=true git rebase --continue
              if git push; then
                echo "Successfully pushed after resolving conflict."
                exit 0
              fi
            fi
            echo "Push failed, aborting rebase and retrying in 10 seconds..."
            git rebase --abort || true
            sleep 10
          done
          echo "Failed to push after 5 attempts."
          exit 1
