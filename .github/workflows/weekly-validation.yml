name: Weekly CCTV Validation

on:
  schedule:
    # Weekly deep validation. Frequent full scans are too expensive for the free quota.
    # Sunday 15:40 KST (= 06:40 UTC), after the weekly full data refresh window.
    - cron: '40 6 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-cctv-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run Validation Script
      env:
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      run: python validate_weekly.py
