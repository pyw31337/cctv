name: Daily UTIC Resurrect

# audit_utic_broken.py 가 manual_check 로 마킹한 카메라들을 매일 부활 시도.
# 100 표본 검증 결과 약 56% 가 UTIC API 에서 살아있음 (URL 만 stale). API 로 fresh 정보 받아
# URL 재구성 후 worker /utic 으로 검증해 OK 면 status=active 복원.

on:
  schedule:
    # 매일 07:00 KST (= 22:00 UTC 전날). UTIC 감사와 GITS ingest 이후 순차 실행.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  resurrect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run resurrect
        run: |
          set +e
          python scripts/resurrect_utic.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::UTIC resurrect failed with exit $code. Keeping existing catalog and recording workflow status."
            cp /tmp/cctv_data.before.json cctv_data.json
            python scripts/write_workflow_status.py --workflow "Daily UTIC Resurrect" --job resurrect --status warning --impact possible --message "resurrect_utic.py exited $code; existing cctv_data.json preserved"
          fi

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Commit results
        run: |
          scripts/commit_and_push_changes.sh "chore: daily UTIC resurrect [skip ci]" cctv_data.json data/utic_audit_history.json data/workflow_status.json
