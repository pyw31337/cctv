name: GITS Daily Ingest

# GITS 카메라 (경기도) 1,800+개의 popup token 은 단기 만료성이라 daily fresh ingest 필요.
# 이전엔 cctv-proxy worker /gits 가 실시간 fetch 했으나 Oracle /gits 가 hang 하면서 망가짐.
# popup 자체는 살아있어서 collectors.gits.GitsCollector 로 직접 긁어 cctv_data.json 에 넣는다.

on:
  schedule:
    # 매일 06:10 KST (= 21:10 UTC 전날). CultureFlow/CCTV 감사 작업과 시간 분리.
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run GITS ingest
        run: python scripts/ingest_gits.py

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Commit changes
        run: |
          scripts/commit_and_push_changes.sh "chore: daily GITS ingest [skip ci]" cctv_data.json
