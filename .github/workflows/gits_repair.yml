name: GITS Daily Ingest

# GITS 카메라 (경기도) 1,800+개의 popup token 은 단기 만료성이라 daily fresh ingest 필요.
# 이전엔 cctv-proxy worker /gits 가 실시간 fetch 했으나 Oracle /gits 가 hang 하면서 망가짐.
# popup 자체는 살아있어서 collectors.gits.GitsCollector 로 직접 긁어 cctv_data.json 에 넣는다.

on:
  schedule:
    # Six-hour wake-up; adaptive_collection decides whether GITS is due.
    - cron: '05 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Plan adaptive collection
        id: plan
        run: python scripts/adaptive_collection.py plan --github-output

      - name: Run GITS ingest
        id: gits_ingest
        if: steps.plan.outputs.due_gits_ingest == 'true'
        continue-on-error: true
        run: |
          python scripts/ingest_gits.py

      - name: Record adaptive collection result
        if: always() && steps.plan.outputs.due_gits_ingest == 'true'
        run: |
          if [[ "${{ steps.gits_ingest.outcome }}" == "success" ]]; then
            python scripts/adaptive_collection.py record --task gits_ingest --result success
          else
            python scripts/adaptive_collection.py record --task gits_ingest --result failure
          fi

      - name: Guard data preservation
        run: |
          python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses
          python scripts/write_workflow_status.py \
            --workflow "GITS Daily Ingest" \
            --job ingest \
            --status ok \
            --impact none \
            --message "GITS delta ingest accepted; refreshed streams merged and missing IDs preserved for recheck"

      - name: Validate persisted data integrity
        run: python scripts/validate_static_data.py cctv_data.json

      - name: Commit changes
        run: |
          if git diff --quiet -- cctv_data.json data/workflow_status.json data/collection_schedule.json; then
            echo "No GITS or scheduler changes"
          else
            scripts/commit_and_push_changes.sh "chore: adaptive GITS ingest [skip ci]" cctv_data.json data/workflow_status.json data/collection_schedule.json
          fi
