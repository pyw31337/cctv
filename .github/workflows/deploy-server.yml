name: Deploy Server to Fly.io

on:
  workflow_dispatch:

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sync provider secrets to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
          UTIC_API_KEY: ${{ secrets.UTIC_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          [[ -n "${EX_API_KEY:-}" ]] && args+=("EX_API_KEY=$EX_API_KEY")
          [[ -n "${UTIC_API_KEY:-}" ]] && args+=("UTIC_API_KEY=$UTIC_API_KEY")
          if ((${#args[@]} == 0)); then
            echo 'No provider secrets are configured; leaving existing Fly secrets unchanged.'
          else
            flyctl secrets set "${args[@]}" --app cctv-proxy-hoon-001
          fi
      
      - name: Deploy Server
        run: |
          flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
