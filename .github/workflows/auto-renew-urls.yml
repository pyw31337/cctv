name: Auto-Renew CCTV URLs

on:
  schedule:
    # Six-hour wake-up; adaptive_collection decides whether renewal is due.
    - cron: '33 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  renew-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Plan adaptive collection
        id: plan
        run: python scripts/adaptive_collection.py plan --github-output

      - name: Run Health Check (Detect Failures)
        if: steps.plan.outputs.due_utic_renew == 'true'
        run: python monitor_health.py || true # Allow failure to proceed to renewal

      - name: Run Auto-Renewal
        if: steps.plan.outputs.due_utic_renew == 'true' || steps.plan.outputs.due_kbs_renew == 'true'
        id: renew
        continue-on-error: true
        env:
          UTIC_API_KEY: ${{ secrets.UTIC_API_KEY }}
          RENEW_UTIC: ${{ steps.plan.outputs.due_utic_renew }}
          RENEW_KBS: ${{ steps.plan.outputs.due_kbs_renew }}
        run: |
          set +e
          python scripts/renew_cctv_urls.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::Auto-renew failed with exit $code. Keeping existing catalog and recording workflow status."
            cp /tmp/cctv_data.before.json cctv_data.json
            python scripts/write_workflow_status.py --workflow "Auto-Renew CCTV URLs" --job renew-urls --status warning --impact possible --message "renew_cctv_urls.py exited $code; existing cctv_data.json preserved"
          fi

      - name: Record adaptive UTIC renewal result
        if: always() && steps.plan.outputs.due_utic_renew == 'true'
        run: |
          if [[ "${{ steps.renew.outputs.exit_code }}" == "0" ]]; then
            python scripts/adaptive_collection.py record --task utic_renew --result success
          else
            python scripts/adaptive_collection.py record --task utic_renew --result failure
          fi

      - name: Record adaptive KBS renewal result
        if: always() && steps.plan.outputs.due_kbs_renew == 'true'
        run: |
          if [[ "${{ steps.renew.outputs.exit_code }}" == "0" ]]; then
            python scripts/adaptive_collection.py record --task kbs_renew --result success
          else
            python scripts/adaptive_collection.py record --task kbs_renew --result failure
          fi

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Validate persisted data hygiene
        run: python scripts/validate_static_data.py cctv_data.json

      - name: Record catalog playability change
        run: python scripts/build_catalog_playability_report.py --event url_renewal

      - name: Commit and Push Changes
        run: |
          if git diff --quiet -- cctv_data.json data/workflow_status.json data/collection_schedule.json data/catalog_playability_report.json data/catalog_playability_history.json; then
            echo "No renewal or scheduler changes"
          else
            scripts/commit_and_push_changes.sh "chore: adaptive URL renewal [skip ci]" cctv_data.json data/workflow_status.json data/collection_schedule.json data/catalog_playability_report.json data/catalog_playability_history.json
          fi
