name: Auto-Renew CCTV URLs

on:
  schedule:
    # Mon/Thu 11:35 KST (= 02:35 UTC). Heavy repair window is intentionally daytime.
    - cron: '35 2 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  renew-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run Health Check (Detect Failures)
        run: python monitor_health.py || true # Allow failure to proceed to renewal

      - name: Run Auto-Renewal
        run: |
          set +e
          python scripts/renew_cctv_urls.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Auto-renew failed with exit $code. Keeping existing catalog and recording workflow status."
            cp /tmp/cctv_data.before.json cctv_data.json
            python scripts/write_workflow_status.py --workflow "Auto-Renew CCTV URLs" --job renew-urls --status warning --impact possible --message "renew_cctv_urls.py exited $code; existing cctv_data.json preserved"
          fi

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Commit and Push Changes
        run: |
          scripts/commit_and_push_changes.sh "chore: auto-renew broken cctv urls [skip ci]" cctv_data.json data/workflow_status.json
