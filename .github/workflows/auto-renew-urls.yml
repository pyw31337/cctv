name: Auto-Renew CCTV URLs

on:
  schedule:
    - cron: '0 2 * * 1,4' # Twice weekly to preserve the free Actions quota.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  renew-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run Health Check (Detect Failures)
        run: python monitor_health.py || true # Allow failure to proceed to renewal

      - name: Run Auto-Renewal
        run: python scripts/renew_cctv_urls.py

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Commit and Push Changes
        run: |
          scripts/commit_and_push_changes.sh "chore: auto-renew broken cctv urls [skip ci]" cctv_data.json
