name: Refresh KMA precipitation grid

# Pulls the KMA short-term forecast for ~25 grid points covering Korea and
# writes data/kma_precip_current.json. Powers the "강수/적설 오버레이" toggle
# on the domestic Kakao map. KMA endpoint is public and key-free.

on:
  schedule:
    - cron: '11,41 * * * *'   # 30분마다. 정시/30분 및 quality-summary와 분산.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Own group: this is the only workflow that ever writes
  # data/kma_precip_current.json, so it can't race with anything in
  # cctv-repo-writes. Splitting it out means the 30-min cadence no longer
  # queues behind long-running jobs (e.g. update_cctv.yml's weekly 4h run)
  # in that shared group.
  group: cctv-kma-writes
  cancel-in-progress: false

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh grid
        run: python3 scripts/refresh_kma_precip.py -v

      - name: Commit if changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/kma_precip_current.json; then
            scripts/commit_and_push_changes.sh "chore(data): refresh KMA precipitation grid [skip ci]" data/kma_precip_current.json
          else
            echo "No change in KMA grid — skipping commit."
          fi
