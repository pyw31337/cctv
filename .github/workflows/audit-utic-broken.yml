name: Daily UTIC Broken Audit

on:
  schedule:
    # 매일 05:20 KST (= 20:20 UTC 전날). CultureFlow 03:00 KST fallback 이후로 분산.
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Snapshot current dataset
        run: cp cctv_data.json /tmp/cctv_data.before.json

      - name: Run audit
        run: |
          set +e
          python scripts/audit_utic_broken.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::UTIC audit failed with exit $code. Keeping existing catalog and recording workflow status."
            cp /tmp/cctv_data.before.json cctv_data.json
            python scripts/write_workflow_status.py --workflow "Daily UTIC Broken Audit" --job audit --status warning --impact possible --message "audit_utic_broken.py exited $code; existing cctv_data.json preserved"
          fi

      - name: Guard data preservation
        run: python scripts/guard_data_preservation.py --previous /tmp/cctv_data.before.json --fix-statuses

      - name: Commit results
        run: |
          scripts/commit_and_push_changes.sh "chore: daily UTIC broken audit [skip ci]" cctv_data.json data/utic_audit_history.json data/workflow_status.json
