name: Regional Health Sentinel

on:
  schedule:
    - cron: '*/10 * * * *'  # Run every 10 minutes
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Sentinel Script
        run: |
          python scripts/sentinel.py
          
      - name: Commit and Push Status
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AUTO: Update Regional Health Status"
          file_pattern: 'data/status.json'
          commit_user_name: "Sentinel Bot"
          commit_user_email: "actions@github.com"
          commit_author: "Sentinel Bot <actions@github.com>"
