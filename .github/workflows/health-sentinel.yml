name: Regional Health Sentinel

on:
  # Scheduled runs moved to Oracle cron to preserve GitHub Actions minutes.
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: regional-health-sentinel
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Sentinel Script
        run: |
          python scripts/sentinel.py
          
      - name: Commit and Push Status
        run: |
          git config --global user.name 'Sentinel Bot'
          git config --global user.email 'actions@github.com'
          # Check if data/status.json was modified
          if [[ -n $(git status -s data/status.json) ]]; then
            git add data/status.json
            git commit -m "AUTO: Update Regional Health Status [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes in health status."
          fi
