name: Regional Health Sentinel

on:
  # Scheduled runs moved to Oracle cron to preserve GitHub Actions minutes.
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: cctv-repo-writes
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Sentinel Script
        run: |
          python scripts/sentinel.py
          
      - name: Commit and Push Status
        run: |
          # Check if data/status.json was modified
          if [[ -n $(git status -s data/status.json) ]]; then
            GIT_COMMIT_USER_NAME='Sentinel Bot' GIT_COMMIT_USER_EMAIL='actions@github.com' scripts/commit_and_push_changes.sh "AUTO: Update Regional Health Status [skip ci]" data/status.json
          else
            echo "No changes in health status."
          fi
