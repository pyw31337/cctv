name: Regional Health Sentinel

on:
  schedule:
    - cron: '*/10 * * * *'  # Run every 10 minutes
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Sentinel Script
        run: |
          python scripts/sentinel.py
          
      - name: Commit and Push Status
        run: |
          git config --global user.name 'Sentinel Bot'
          git config --global user.email 'actions@github.com'
          # Check if data/status.json was modified
          if [[ -n $(git status -s data/status.json) ]]; then
            git add data/status.json
            git commit -m "AUTO: Update Regional Health Status"
            git pull --rebase origin main
            git push
          else
            echo "No changes in health status."
          fi
