name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    # Data writers use [skip ci] to avoid a push loop. Re-deploy after the
    # two world catalog writers finish so public Pages never serves a stale
    # playability decision.
    workflows: ["World Tour Playability Audit", "World Tour CCTV Refresh"]
    types: [completed]
  schedule:
    # Other automated data commits (quality policy, domestic repair queue,
    # weather, and cache status) also reach the public static site promptly.
    - cron: '17 */4 * * *'
  workflow_dispatch:

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare deploy directory
        run: |
          python scripts/validate_static_data.py cctv_data.json
          python scripts/split_cctv_data.py
          mkdir -p _site
          # Copy only web-serving files (HTML, JS, CSS, JSON data, images, manifests)
          rsync -av --include='*.html' --include='*.js' --include='*.css' \
            --include='*.json' --include='*.png' --include='*.ico' \
            --include='*.svg' --include='*.webmanifest' --include='*.txt' \
            --include='.nojekyll' \
            --exclude='venv/' --exclude='scripts/' --exclude='server/' \
            --exclude='rtsp-server/' --exclude='workers/' --exclude='ops/' \
            --exclude='utils/' --exclude='docs/' --exclude='logs/' \
            --exclude='artifacts_backup/' --exclude='_legacy_backup/' \
            --exclude='.git/' --exclude='.github/' --exclude='*.py' \
            --exclude='*.log' --exclude='*.xls' --exclude='*.webp' \
            --exclude='*.bk*' --exclude='node_modules/' \
            --exclude='cctv_data_pre_audit_v2.json' \
            --exclude='cctv_data_test.json' \
            --exclude='validation_results.jsonl' \
            --exclude='integrity_report.json' \
            --exclude='spatic_raw.json' \
            --exclude='ntic_data.json' \
            --exclude='oracle_key*' \
            --exclude='Dockerfile' \
            --prune-empty-dirs \
            . _site/
          # Copy data directory fully (needed for app)
          mkdir -p _site/data
          cp data/*.json _site/data/
          # The auto-bump workflow writes version tokens in a separate commit,
          # which can run after this deployment starts. Version the artifact
          # itself so a fresh deployment never reuses a prior shell or a
          # lazy-loaded module from the browser/service-worker cache.
          VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          sed -i -E "s|\\?v=[a-zA-Z0-9._-]+|?v=${VERSION}|g" _site/index.html _site/site.webmanifest _site/sw.js
          sed -i -E "s|CACHE_VERSION = '[^']+';|CACHE_VERSION = 'v${VERSION}';|" _site/sw.js
          sed -i -E "s|const buildVersion = '[^']+';|const buildVersion = '${VERSION}';|" _site/js/runtime-config.js
          echo "Deploy shell version: ${VERSION}"
          test -f _site/index.html
          test -d _site/js
          test -d _site/css
          test -f _site/data/cctv_core.json
          grep -q "js/app.js?v=${VERSION}" _site/index.html
          grep -q "const buildVersion = '${VERSION}';" _site/js/runtime-config.js
          grep -q "CACHE_VERSION = 'v${VERSION}';" _site/sw.js
          echo "=== Deploy size ==="
          du -sh _site/
          echo "=== File count ==="
          find _site/ -type f | wc -l

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
