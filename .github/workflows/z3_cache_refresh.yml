name: Refresh Playback Addresses

on:
  # GitHub scheduling is not a real-time service and may delay 15-minute
  # jobs for hours. The dedicated local/Oracle operation is primary; this is
  # a low-frequency independent fallback for sleeping/offline operation hosts.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

env:
  CCTV_COMMIT_PUSH_SOFT_FAIL: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: cctv-repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Refresh and audit Z3 cache
        run: >
          python scripts/refresh_z3_cache.py
          --max-age-minutes 10
          --force
          --stale-ok-on-refresh-failure-hours 0.75
          --fallback-cache-url https://158.179.194.163.sslip.io/z3-cache.json

      - name: Normalize dashboard timestamps
        if: always()
        run: python3 scripts/standardize_quality_times.py --source github-z3-refresh || true

      - name: Commit and push if changed
        run: |
          # Own only Z3 cache artifacts. Other health snapshots may have been
          # refreshed after checkout and must never be replayed from this job.
          if git diff --quiet -- data/z3_cache.json data/cache_status.json; then
            echo "No cache changes"
          else
            scripts/commit_and_push_changes.sh "AUTO: Refresh Z3 appUrl cache [skip ci]" data/z3_cache.json data/cache_status.json
          fi
