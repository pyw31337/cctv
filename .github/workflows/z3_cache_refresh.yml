name: Z3 Cache Refresh

on:
  # Oracle cron + /z3-cache.json is the primary freshness path.
  # This low-frequency job is only a static GitHub Pages fallback.
  schedule:
    - cron: '7 19 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: z3-cache-refresh
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and audit Z3 cache
        run: python scripts/refresh_z3_cache.py --max-age-minutes 45 --force

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/z3_cache.json data/cache_status.json
          if git diff --staged --quiet; then
            echo "No cache changes"
          else
            git commit -m "AUTO: Refresh Z3 appUrl cache [skip ci]"
            git push
          fi
