name: Z3 Cache Refresh

on:
  schedule:
    # Run every 30 minutes — tokens expire ~1h so 30min keeps them always fresh
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Fetch Z3 cache from its.go.kr
        id: fetch
        run: |
          python3 - <<'EOF'
          import requests, json, os, sys, time
          from datetime import datetime
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          # Rotate User-Agent per attempt to bypass IP-based filtering
          USER_AGENTS = [
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4_1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0',
          ]

          def try_get_xsrf(ua):
              s = requests.Session()
              s.verify = False
              headers = {
                  'User-Agent': ua,
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7',
                  'Accept-Encoding': 'gzip, deflate, br',
                  'Connection': 'keep-alive',
                  'Upgrade-Insecure-Requests': '1',
                  'Cache-Control': 'max-age=0',
              }
              r = s.get('https://its.go.kr/', timeout=20, headers=headers)
              xsrf = s.cookies.get('XSRF-TOKEN', '')
              return s, xsrf

          MAX_ATTEMPTS = 3
          s = None
          xsrf = ''

          for attempt in range(MAX_ATTEMPTS):
              ua = USER_AGENTS[attempt % len(USER_AGENTS)]
              print(f"Attempt {attempt + 1}/{MAX_ATTEMPTS}: getting XSRF token...")
              try:
                  s, xsrf = try_get_xsrf(ua)
                  if xsrf:
                      print(f"XSRF obtained: {xsrf[:20]}...")
                      break
                  print(f"No XSRF token on attempt {attempt + 1}")
              except Exception as e:
                  print(f"Attempt {attempt + 1} error: {e}")

              if attempt < MAX_ATTEMPTS - 1:
                  delay = 15 * (attempt + 1)
                  print(f"Waiting {delay}s before retry...")
                  time.sleep(delay)

          if not xsrf:
              print("WARNING: All attempts failed to get XSRF token.")
              print("GitHub Actions runner IP may be blocked by its.go.kr.")
              print("Exiting gracefully to preserve existing cache.")
              sys.exit(0)

          # Fetch all CCTV markers
          print("Fetching CCTV markers...")
          headers = {
              'User-Agent': USER_AGENTS[0],
              'Referer': 'https://its.go.kr/',
              'Content-Type': 'application/json',
              'X-XSRF-TOKEN': xsrf,
              'Accept': 'application/json',
              'Origin': 'https://its.go.kr',
          }
          try:
              r2 = s.post(
                  'https://its.go.kr/map/getMarkers',
                  data=json.dumps({'body': {'data': {'type': 'CCTV'}}}),
                  headers=headers,
                  timeout=120,
              )
          except Exception as e:
              print(f"WARNING: getMarkers request failed: {e}")
              print("Exiting gracefully to preserve existing cache.")
              sys.exit(0)

          print(f"Status: {r2.status_code}, Size: {len(r2.content)/1024/1024:.1f}MB")
          if r2.status_code != 200:
              print(f"ERROR: Unexpected status {r2.status_code}: {r2.text[:200]}")
              sys.exit(1)

          features = r2.json().get('features', [])
          print(f"Features: {len(features)}")

          cctvip_map = {}
          for f in features:
              props = f.get('properties', {})
              info_str = props.get('INFO', '{}')
              try:
                  info = json.loads(info_str) if isinstance(info_str, str) else info_str
              except Exception:
                  continue
              app_url = info.get('appUrl', '')
              if app_url and 'cctvsec.ktict.co.kr' in app_url:
                  parts = app_url.split('/')
                  if len(parts) >= 4:
                      cctvip_map[parts[3]] = app_url

          print(f"cctvip map entries: {len(cctvip_map)}")
          if not cctvip_map:
              print("ERROR: No entries extracted from markers response.")
              sys.exit(1)

          os.makedirs('data', exist_ok=True)
          cache = {
              'fetched': datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'entries': len(cctvip_map),
              'data': cctvip_map,
          }
          with open('data/z3_cache.json', 'w') as f:
              json.dump(cache, f, ensure_ascii=False, separators=(',', ':'))

          size = os.path.getsize('data/z3_cache.json')
          print(f"Saved data/z3_cache.json: {size/1024:.1f}KB with {len(cctvip_map)} entries")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/z3_cache.json
          if git diff --staged --quiet; then
            echo "No changes to z3_cache.json"
          else
            git commit -m "AUTO: Refresh Z3 appUrl cache [skip ci]"
            git push
          fi
