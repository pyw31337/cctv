name: Z3 Cache Refresh

on:
  # Oracle cron + /z3-cache.json is the primary freshness path.
  # This keeps the static GitHub Pages fallback fresh enough for Z3 appUrl tokens.
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cctv-repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh and audit Z3 cache
        run: python scripts/refresh_z3_cache.py --max-age-minutes 45 --force --stale-ok-on-refresh-failure-hours 8

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/z3_cache.json data/cache_status.json; then
            echo "No cache changes"
          else
            scripts/commit_and_push_changes.sh "AUTO: Refresh Z3 appUrl cache [skip ci]" data/z3_cache.json data/cache_status.json
          fi
