<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>전국 도로 CCTV (Beta)</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Libraries -->
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Kakao Maps API -->
    <script type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0236cfffa7cfef34abacd91a6d7c73c0&libraries=services,clusterer"
        onerror="window.kakaoScriptFailed = true;">
        </script>
</head>

<body>
    <!-- Dim Overlay -->
    <div class="dim-overlay"></div>

    <div class="container">
        <!-- Floating Tab Navigation -->
        <div class="tab-nav-container">
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="video">CCTV</button>
                <button class="tab-btn" data-tab="map">지도</button>
            </div>
        </div>

        <!-- Tab Content -->

        <!-- VIDEO TAB (4-Split Grid) -->
        <div id="video-tab" class="tab-content active">
            <div class="grid-container">
                <!-- Slot 1 -->
                <div class="cctv-item" id="cctv-1">
                    <div class="placeholder">Loading...</div>
                    <div class="cctv-label">
                        <div class="cctv-label-wrapper">
                            <div class="custom-select-container" data-slot="1">
                                <div class="custom-select-trigger">CCTV 선택</div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Slot 2 -->
                <div class="cctv-item" id="cctv-2">
                    <div class="placeholder">Loading...</div>
                    <div class="cctv-label">
                        <div class="cctv-label-wrapper">
                            <div class="custom-select-container" data-slot="2">
                                <div class="custom-select-trigger">CCTV 선택</div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Slot 3 -->
                <div class="cctv-item" id="cctv-3">
                    <div class="placeholder">Loading...</div>
                    <div class="cctv-label">
                        <div class="cctv-label-wrapper">
                            <div class="custom-select-container" data-slot="3">
                                <div class="custom-select-trigger">CCTV 선택</div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Slot 4 -->
                <div class="cctv-item" id="cctv-4">
                    <div class="placeholder">Loading...</div>
                    <div class="cctv-label">
                        <div class="cctv-label-wrapper">
                            <div class="custom-select-container" data-slot="4">
                                <div class="custom-select-trigger">CCTV 선택</div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resizer Handle -->
                <div class="resizer-handle" id="resizer">
                    <svg class="resizer-icon" viewBox="0 0 24 24">
                        <path d="M12 4V20M4 12H20" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </div> <!-- End Grid -->

            <div id="video-status" class="status-text"></div>
        </div>

        <!-- MAP TAB -->
        <div id="map-tab" class="tab-content">
            <div id="map-container">
                <div id="map"></div>
                <button id="map-refresh-btn" class="map-refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3" />
                    </svg>
                    <span>이 구역 검색</span>
                </button>
            </div>
            <div id="map-status" class="status-text"></div>
        </div>

        <!-- Floating Search -->
        <div class="floating-search-container">
            <div class="floating-search-wrapper">
                <div class="search-results" id="video-search-results"></div>
                <div class="floating-search">
                    <button id="video-location-btn" class="floating-search-btn" title="현재 위치"
                        style="background:rgba(255,255,255,0.1); margin-right:4px;">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="white">
                            <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z" />
                            <circle cx="12" cy="9" r="2.5" />
                        </svg>
                    </button>
                    <!-- Inputs for Sync -->
                    <input type="text" id="video-keyword" class="floating-search-input" placeholder="지역 또는 CCTV 검색"
                        enterkeyhint="search">
                    <input type="hidden" id="map-keyword">

                    <button id="video-clear-btn" class="floating-clear-btn">✕</button>
                    <button id="video-search-btn" class="floating-search-btn">
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div> <!-- End Container -->

    <!-- Video Layer Popup (Independent from Tabs) -->
    <div id="video-layer" class="video-layer">
        <div class="video-layer-content">
            <div class="video-layer-header">
                <div class="video-layer-title" id="video-layer-title">CCTV Name</div>
                <button class="video-layer-close" id="video-layer-close">×</button>
            </div>
            <div id="video-frame" class="video-frame"></div>
        </div>
    </div>

    <!-- Application Logic (Modularized) -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/video.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Init Event Listeners for Search
        document.getElementById('video-search-btn').addEventListener('click', () => {
            const keyword = document.getElementById('video-keyword').value;
            handleSearch(keyword, 'video');
        });
        document.getElementById('video-keyword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch(e.target.value, 'video');
                document.getElementById('video-keyword').blur();
            }
        });
        document.getElementById('video-clear-btn').addEventListener('click', () => {
            document.getElementById('video-keyword').value = '';
            document.getElementById('video-search-results').classList.remove('active');
            document.querySelector('.dim-overlay').classList.remove('active');
            this.classList.remove('visible');
        });

        // Search Focus Events (for Dim Overlay and Mobile positioning)
        const vInput = document.getElementById('video-keyword');
        if (vInput) {
            vInput.addEventListener('focus', () => {
                document.querySelector('.dim-overlay').classList.add('active');
                document.querySelector('.floating-search-container').classList.add('keyboard-active');
            });
            vInput.addEventListener('blur', () => {
                setTimeout(() => {
                    if (!document.getElementById('video-search-results').classList.contains('active')) {
                        document.querySelector('.dim-overlay').classList.remove('active');
                    }
                    document.querySelector('.floating-search-container').classList.remove('keyboard-active');
                }, 200);
            });
        }
    </script>
</body>

</html>
